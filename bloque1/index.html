<style id="fix-quirurgico-b1">
/* FIX FONDO BLANCO FORZADO + RECORTADO HERO */
html,body,#root{background:#FFFFFF !important;}
/* Fix hero imagen pareja no recortada */
img{object-fit:cover !important;}
.hero-fix img, .hero img{object-fit:contain !important; height:auto !important; max-height:600px !important;}
/* Barra NODO/NODO MAX/NODO+ fija en todos */
.fix-nav-bar{position:sticky !important; top:0 !important; z-index:50 !important; background:#FFFFFF !important; border-bottom:1px solid #eee !important;}
/* Ocultar textos sueltos dev */
*[data-dev], .dev-text{display:none !important;}
</style>
<script id="fix-quirurgico-js-b1">
(function(){
  // 1. NAVEGACION REAL - reemplaza toast "Navegando a..."
  function go(p){ window.location.href=p; }
  function patchButtons(){
    document.querySelectorAll('button').forEach(function(b){
      var t=(b.innerText||'').trim().toUpperCase();
      if(t==='NODO MAX'){ b.onclick=function(e){e.preventDefault(); go('/bloque2/');}; b.setAttribute('data-fixed','1'); }
      if(t==='NODO+'){ b.onclick=function(e){e.preventDefault(); go('/bloque3/');}; b.setAttribute('data-fixed','1'); }
      if(t==='NODO' && !b.closest('[data-fixed]')){ 
        // Solo si es el boton NODO solo, no NODO MAX/+
        if(b.innerText.trim()==='NODO'){ b.onclick=function(e){e.preventDefault(); go('/bloque1/');}; }
      }
    });
    // Inicio -> scroll a registro
    document.querySelectorAll('button, a').forEach(function(b){
      var txt=(b.innerText||'').toLowerCase();
      if(txt.includes('inicio') || txt.includes('empezá ahora') || txt.includes('crear cuenta')){
        b.addEventListener('click', function(e){
          var sec=document.querySelector('#registro, #inicio, [id*=registro]');
          if(sec){ e.preventDefault(); sec.scrollIntoView({behavior:'smooth'}); }
        }, {once:true});
      }
    });
    // Campanita funcional
    var camp=document.querySelector('[aria-label*=notific], [class*=bell], button:has(svg)');
    // Buscamos campanita por icono
    document.querySelectorAll('button').forEach(function(b){
      if(b.innerHTML.includes('bell') || b.innerHTML.includes('campan') || b.querySelector('svg')){
        var txt=b.innerText.trim();
        if(txt==='' || txt.length<3){ // probablemente campanita
          b.onclick=function(){
            alert('🔔 NODO Notificaciones\nSin notificaciones aún.\nTe avisamos de nuevos comercios y tareas cerca tuyo.\n\nBóveda segura: tus tarjetas están encriptadas. Solo bots autorizados procesan CSI/CTCI/RECARGAS.');
          };
        }
      }
    });
    // 2. OCULTAR TEXTOS SUELTOS "Logo comercio* galería SÍ"
    document.body.innerHTML = document.body.innerHTML.replace(/Logo comercio\* galería SÍ/gi, '').replace(/Banner comercio\* galería SÍ/gi, '');
    // 3. FIX CUIT/CUIL - buscar input CUIT y agregar opción
    setTimeout(function(){
      document.querySelectorAll('input').forEach(function(inp){
        var ph=(inp.placeholder||'').toUpperCase();
        var label=(inp.getAttribute('aria-label')||'').toUpperCase();
        if(ph.includes('CUIT') || label.includes('CUIT') || inp.name && inp.name.toLowerCase().includes('cuit')){
          inp.placeholder='CUIT/CUIL - 11 dígitos';
          // Agregar checkbox si no existe
          if(!document.getElementById('no-cuit-check')){
            var chk=document.createElement('div');
            chk.innerHTML='<label style="display:flex;gap:8px;font-size:12px;margin:8px 0;"><input type="checkbox" id="no-cuit-check"> No poseo CUIT/CUIL, soy monotributista/particular</label><div style="font-size:11px;color:#666;">Verificación CUIT/CUIL - Si no tenés, podés registrarte igual. Validamos identidad con DNI + foto.</div>';
            inp.parentNode.insertBefore(chk, inp.nextSibling);
            document.getElementById('no-cuit-check').addEventListener('change', function(){
              inp.required=!this.checked;
              inp.disabled=this.checked;
              if(this.checked) inp.value='';
            });
          }
        }
      });
    }, 1000);
    // 4. BOVEDA SEGURA + TERMINOS COMPLETOS - inyectar en footer o modal Ley 25.326
    var leyModal=document.querySelector('[class*=modal], [role=dialog]');
    if(leyModal){
      // Ampliar texto Ley 25.326 con terminos completos
      var extra=document.createElement('div');
      extra.style.cssText='font-size:11px; color:#555; margin-top:12px; border-top:1px solid #eee; padding-top:12px; text-align:left;';
      extra.innerHTML='<b>Términos completos NODO Argentina:</b><br>• Cláusula 5% diario obligatorio comercios para permanecer.<br>• Fotos/documentos solo para validar identidad, no se comparten sin consentimiento.<br>• Derecho acceder/rectificar/suprimir datos. Contacto: privacidad@nodo.com.ar<br>• CSI: 2% + 0.21% IVA por cada venta NODO MAX (debita de tarjetas asociadas - podés agregar todas tus tarjetas a tu nombre en Bóveda Segura).<br>• CTCI: 12%+IVA por tarea NODO+ (paga cliente que solicita servicio).<br>• RECARGAS: 7% por cada recarga C$B a tu MP.<br>• Bóveda segura encriptada: solo bots autorizados acceden para procesar pagos. Compatible MP hoy, preparada para futuros bancos (agregá token en Render y queda vinculado).<br>• Validación tiempo real, SSL, Ley 25.326 2026.';
      leyModal.appendChild(extra);
    }
  }
  document.addEventListener('DOMContentLoaded', patchButtons);
  window.addEventListener('load', patchButtons);
  setTimeout(patchButtons, 1500);
  // Override toast "Navegando a..."
  var origToast=window.alert;
  // Interceptar cualquier función que muestre "Navegando a"
  const observer=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.innerText && n.innerText.includes('Navegando a')){
          var txt=n.innerText;
          if(txt.includes('NODO MAX')){ n.remove(); go('/bloque2/'); }
          if(txt.includes('NODO+')){ n.remove(); go('/bloque3/'); }
        }
      });
    });
  });
  observer.observe(document.body, {childList:true, subtree:true});
})();
</script>
