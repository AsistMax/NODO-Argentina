*/

  font-size: 80%;
}

sub,
sup {
  font-size: 75%;

  position: relative;

}

  bottom: -0.25em;

sup {
  top: -0.5em;
}

/*

3. Remove gaps between table borders by default.
*/

table {
  text-indent: 0;
  /* 1 */
  border-color: inherit;
  /* 2 */
  border-collapse: collapse;
  /* 3 */
}

/*
1. Change the font styles in all browsers.
2. Remove the margin in Firefox and Safari.
3. Remove default padding in all browsers.

input,
optgroup,
select,

  /* 1 */
  font-feature-settings: inherit;
  /* 1 */
  font-variation-settings: inherit;
  /* 1 */
  font-size: 100%;
  /* 1 */
  font-weight: inherit;
  /* 1 */
  line-height: inherit;
  /* 1 */
  letter-spacing: inherit;
  /* 1 */
  color: inherit;
  /* 1 */
  margin: 0;
  /* 2 */
  padding: 0;
  /* 3 */

select {
  text-transform: none;

  /* 2 */
  background-image: none;

  vertical-align: baseline;

  height: auto;
}

1. Correct the odd appearance in Chrome and Safari.

  -webkit-appearance: textfield;
  /* 1 */
  outline-offset: -2px;
  /* 2 */

  -webkit-appearance: none;

h4,
h5,

figure,
p,
pre {

}

fieldset {
  margin: 0;
  padding: 0;
}

legend {
  padding: 0;
}

ol,
ul,
menu {
  list-style: none;
  margin: 0;
  padding: 0;

  /* 1 */

  /* 2 */

  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */

  position: fixed;
}

.relative {
  position: relative;
}

.sticky {
  position: sticky;
}

.block {
  display: block;
}

.flex {
  display: flex;
}

.table {
  display: table;
}

.grid {

}

:root{
  --navy:#0A1633;
  --blue:#2E5BFF;
  --blue-soft:#EAF0FF;
  --surface:#FFFFFF;
  --muted:#5B657A;
  --line:#E6EAF3;
  --bg:#FFFFFF;
  --card:#F6F8FF;
  --success:#0E9A6B;
  --amber:#FFB020;
  --safe-area-inset-top:0px;
}

@media (prefers-color-scheme: dark){
  :root{
    --navy:#EAF0FF;
    --surface:#0A1633;
    --bg:#070D22;
    --card:#111D42;
    --line:#24305A;
    --muted:#B9C2D8;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:ui-sans-system,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif
}

button,input,select,textarea{
  font:inherit
}

a{
  color:inherit
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

input[type=range]{
  accent-color:var(--blue)
}

select,input,textarea{
  outline:none
}
