<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODO Argentina - Publicidad + Cobros para Latinoamérica</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#fff;color:#0f2040;line-height:1.6}
a{color:#0f2040;text-decoration:none}
header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:30}
.nav{max-width:1150px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-weight:900;font-size:22px;letter-spacing:-0.5px}
.logo i{color:#2563eb;font-style:normal}
.nav-links{display:flex;gap:18px;font-size:14px;font-weight:600;align-items:center}
.nav-links a.active{background:#0f2040;color:#fff;padding:8px 14px;border-radius:999px}
@media(max-width:900px){.nav-links{display:none}}
.btn{background:#2563eb;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;border:0;cursor:pointer;font-size:14px}
.btn.dark{background:#0f2040}
.btn.white{background:#fff;color:#0f2040;border:1px solid #e2e8f0}
.btn.sec{background:#fff;color:#0f2040;border:1px solid #cbd5e1}
.wrap{max-width:1150px;margin:0 auto;padding:20px}
.hero{text-align:center;padding:28px 20px 10px}
.hero h1{font-size:92px;line-height:0.9;letter-spacing:-4px}
.hero h1 span{color:#2563eb}
@media(max-width:600px){.hero h1{font-size:58px}}
.hero h2{font-size:28px;margin:16px 0 8px}
.hero p{font-size:16px;color:#475569;max-width:680px;margin:0 auto}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.video-box{max-width:900px;margin:20px auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden}
.video-box video{width:100%;display:block;background:#fff}
.video-fallback{padding:40px;text-align:center;background:#eaf2ff}
.video-fallback b{font-size:36px}
.carrusel-wrap{overflow:hidden;margin:22px 0}
.carrusel-track{display:flex;gap:14px;width:max-content;animation:carrusel 30s linear infinite}
.carrusel-wrap:hover .carrusel-track{animation-play-state:paused}
@keyframes carrusel{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.carrusel-track img{width:280px;height:200px;object-fit:cover;border-radius:18px}
.carrusel-cap{text-align:center;color:#64748b;font-size:13px;margin-top:6px}
.section{margin:34px 0}
.section h2{font-size:30px;margin-bottom:6px}
.sub{color:#475569;font-size:15px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:850px){.grid3{grid-template-columns:1fr}}
.card{border-radius:20px;padding:24px}
.card.light{background:#eef4ff}
.card.dark{background:#0f2040;color:#fff}
.card.light2{background:#e0f2fe}
.card h3{font-size:19px;margin-bottom:10px}
.card p{font-size:14px;color:#334155}
.card.dark p{color:#cbd5e1}
.card button{margin-top:16px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
@media(max-width:700px){.why{grid-template-columns:1fr}}
.why b{font-size:16px}
.why p{font-size:14px;color:#64748b;margin-top:4px}
.panel{background:#0f2040;color:#fff;border-radius:24px;padding:28px;display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
@media(max-width:850px){.panel{grid-template-columns:1fr}}
.panel h2{font-size:32px;line-height:1.2}
.panel h2 span{color:#93c5fd}
.panel-box{background:#fff;color:#0f2040;border-radius:18px;padding:20px}
.calc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:850px){.calc{grid-template-columns:1fr}}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0;font-size:14px}
label{font-size:13px;font-weight:700}
.modo{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.modo button{width:auto;padding:9px 12px;font-size:13px}
.modo button.active{background:#0f2040;color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.cal-grid button{padding:9px 0;font-size:13px;background:#fff;color:#0f2040;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer}
.cal-grid button.sel{background:#2563eb;color:#fff;border-color:#2563eb}
.chat-box,.cobros-box{border:1px solid #e2e8f0;border-radius:20px;padding:22px;margin-top:18px}
.chat-msgs{background:#f8fafc;border-radius:12px;padding:12px;min-height:90px;font-size:14px;margin:10px 0;white-space:pre-wrap}
.paises span{display:inline-block;background:#fff;border:1px solid #e2e8f0;padding:6px 12px;border-radius:999px;font-size:12px;margin:4px 4px 0 0}
.faq{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:10px}
.cta{background:#0f2040;color:#fff;border-radius:24px;padding:30px;text-align:center}
footer{background:#f8fafc;border-top:1px solid #e2e8f0;padding:20px;text-align:center}
footer p{font-size:13px;color:#64748b}
footer .tel{font-size:12px;color:#94a3b8}
.ok{background:#e6f7ee;color:#0a7a3d;padding:10px;border-radius:10px;font-size:13px;margin-top:10px;display:none}
.err{background:#fdecec;color:#b91c1c;padding:10px;border-radius:10px;font-size:13px;margin-top:10px;display:none}
.muted{color:#64748b;font-size:13px}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">NODO <i>•</i> ARGENTINA</div><div class="nav-links"><a href="#" class="active">Inicio</a><a href="#productos">Servicios</a><a href="#productos">Impulso</a><a href="#productos">Expansión</a><a href="#cobros">Cobros</a><a href="#como-funciona">Cómo funciona</a><a href="#resultados">Ver mis resultados</a></div><button class="btn" onclick="document.getElementById('calculadora').scrollIntoView({behavior:'smooth'})">Registrarme</button></div></header>
<div class="wrap">
<section class="hero">

<h2>Tu negocio, con más clientes. Y cobrando todos los meses.</h2>
<p>Publicidad + Cobros, en un solo lugar. Estamos en tu barrio, en el país entero y en toda Latinoamérica.</p>
<div class="hero-btns"><button class="btn" onclick="document.getElementById('calculadora').scrollIntoView({behavior:'smooth'})">Registrarme y empezar</button><button class="btn sec" onclick="document.getElementById('como-funciona').scrollIntoView({behavior:'smooth'})">Cómo funciona</button></div>
