:root{
  --bg:#0A0A0A;
  --surface:#141414;
  --surface-2:#1D1A12;
  --gold:#D4AF37;
  --gold-2:#F2D57E;
  --ink:#FFFFFF;
  --muted:#C9C2B2;
  --line:#3A3323;
  --paper:#FFFDF6;
  --dark:#0A0A0A;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: light){
  :root{
    --muted:#6B6350;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  font-family:'Archivo', ui-sans-serif, system-ui, sans-serif;
  color:var(--ink);
  background:var(--bg);
}

button, input, select, textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.serif{
  font-family:'Source Serif 4', Georgia, serif;
}

.gold-text{
  color:var(--gold);
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
}

.field{
  width:100%;
  background:#0A0A0A;
  border:1px solid #4A4230;
  color:white;
  border-radius:14px;
  padding:14px 15px;
  outline:none;
}

.field:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,175,55,.18);
}

.field::-moz-placeholder{
  color:#8E8775;
}

.field::placeholder{
  color:#8E8775;
}

.label{
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#D8D0BC;
  margin:0 0 7px;
}

.btn-gold{
  background:var(--gold);
  color:#0A0A0A;
  font-weight:900;
  border-radius:14px;
  padding:16px 20px;
  border:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.btn-gold:hover{
  background:var(--gold-2);
}

.btn-line{
  background:transparent;
  color:white;
  border:1.5px solid var(--gold);
  font-weight:800;
  border-radius:14px;
  padding:15px 19px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.btn-line:hover{
  background:rgba(212,175,55,.13);
}

.tab-btn{
  border-radius:999px;
  padding:10px 15px;
  font-size:13px;
  font-weight:800;
  border:1px solid transparent;
  background:transparent;
  color:#C9C2B2;
  white-space:nowrap;
}

.tab-btn.active{
  background:var(--gold);
  color:#0A0A0A;
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
  background:#171713;
}

input[type="range"]{
  accent-color:var(--gold);
  width:100%;
}

.last\:border-0:last-child{
  border-width: 0px;
}

@media (min-width: 640px){
  .sm\:w-auto{
    width: auto;
  }

    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{

  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-start{
    align-items: flex-start;
  }

  .sm\:justify-between{
    justify-content: space-between;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-6{

  }

  .sm\:pt-7{
    padding-top: 1.75rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-\[64px\]{
    font-size: 64px;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

  .md\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .md\:flex{

  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:grid-cols-5{

  }
}

@media (min-width: 1024px){

  }

  }
}
